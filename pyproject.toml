[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-esm"
version = "1.0.0"
description = "Bridging Evolutionary Protein Language Models with Quantum-Informed Molecular Dynamics for Generalizable Binding Affinity Prediction"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "yuanyangshi" }
]

keywords = [
    "protein-ligand-binding",
    "molecular-dynamics",
    "quantum-mechanics",
    "protein-language-models",
    "evidential-deep-learning",
    "drug-discovery",
    "graph-neural-networks"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "pytorch-lightning>=2.0.0",
    "fair-esm>=2.0.0",
    "rdkit>=2022.9.5",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "einops>=0.6.0",
    "h5py>=3.8.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "jupyter>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/yuanyangshi/dynamic-esm"
Repository = "https://github.com/yuanyangshi/dynamic-esm.git"
"Bug Tracker" = "https://github.com/yuanyangshi/dynamic-esm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dynamic_esm*"]
