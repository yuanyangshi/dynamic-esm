name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Run code audit (Zero-Chinese & English Compliance)
      run: |
        python -c "
        import os, re
        binary_exts = {'.png', '.pdf', '.pt', '.ckpt', '.h5', '.hdf5', '.zip', '.pyc', '.npz'}
        chinese_found = 0
        for dp, _, fns in os.walk('.'):
            if '.git' in dp or '__pycache__' in dp: continue
            for fn in fns:
                if os.path.splitext(fn)[1].lower() in binary_exts: continue
                with open(os.path.join(dp, fn), 'r', encoding='utf-8', errors='ignore') as f:
                    if any(re.search(r'[\u4e00-\u9fff]', l) for l in f):
                        chinese_found += 1
                        print(f'Chinese characters detected in: {os.path.join(dp, fn)}')
        assert chinese_found == 0, f'Found {chinese_found} files with Chinese characters!'
        print('All repository text files passed 100% English audit.')
        "

    - name: Run test suite with pytest
      run: |
        pytest tests -v
